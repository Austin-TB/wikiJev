<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wikirace with Jev</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1b19; --muted: #6f6c66; --line: #e4e2dd;
    --accent: #2458d6; --on-accent: #ffffff; --accent-soft: #e3eafb; --bar: #dcd9d3; --win: #1b7f3b; --lose: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121210; --panel: #1c1b19; --text: #f1efea; --muted: #a09c94; --line: #2e2c29;
      --accent: #7aa2ff; --on-accent: #0d1424; --accent-soft: #1f2a44; --bar: #3a3834; --win: #5fd184; --lose: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0; }
  .lede { color: var(--muted); margin: 4px 0 24px; }
  a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
  [hidden] { display: none !important; }

  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
  @media (max-width: 560px) { form { grid-template-columns: 1fr; } }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input {
    font: inherit; font-size: 1rem; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0;
  }
  button {
    font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; padding: 10px 28px; cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .message { margin: 16px 0 0; color: var(--muted); min-height: 1.5em; white-space: pre-line; }
  .message.error { color: var(--lose); }

  .path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 0; padding: 0; list-style: none; }
  .path li { display: flex; align-items: center; gap: 6px; }
  .path li + li::before { content: "→"; color: var(--muted); }
  .chip { padding: 2px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: .9rem; }
  .chip.target { border-style: dashed; color: var(--muted); }
  .chip.reached { border: 1px solid var(--win); color: var(--win); font-weight: 600; }

  #hops { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
  .hop { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .hop { animation: none; } }
  .hop header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; }
  .hop h2 { font-size: 1.05rem; margin: 0; }
  .hop h2 .n { color: var(--muted); font-weight: 400; margin-right: 6px; }
  .meta { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note { margin: 8px 0 0; color: var(--muted); }
  .options { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
  .option { display: grid; grid-template-columns: minmax(0, 14rem) minmax(4rem, 1fr) 3.5rem; gap: 10px; align-items: center; font-size: .9rem; }
  .option .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .option .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .option .fill { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
  .option .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .option.chosen .name { font-weight: 600; }
  .option.chosen .fill { background: var(--accent); }
  .option.chosen .pct { color: var(--text); }

  .summary { margin: 20px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); font-variant-numeric: tabular-nums; }
  .summary strong.won { color: var(--win); }
  .summary strong.lost { color: var(--lose); }
  .summary p { margin: 4px 0 0; font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Wikirace with Jev</h1>
  <p class="lede">Watch Jev pick every click. Edit <code>decide.py</code>, then press Go again to see what changes.</p>
  <form id="race-form">
    <label>Start <input name="start" value="Banana" required autocomplete="off"></label>
    <label>Target <input name="target" value="Napoleon" required autocomplete="off"></label>
    <button type="submit">Go</button>
  </form>
  <p class="message" id="status" role="status"></p>
  <ol class="path" id="path" aria-label="Jev's path"></ol>
  <ol id="hops"></ol>
  <div class="summary" id="summary" hidden></div>
</main>

<template id="hop-template">
  <li class="hop">
    <header>
      <h2><span class="n"></span><a target="_blank" rel="noopener"></a></h2>
      <span class="meta"></span>
    </header>
    <p class="note" hidden></p>
    <ol class="options"></ol>
  </li>
</template>

<script>
  const $ = id => document.getElementById(id);
  let source = null;

  const wikiUrl = title => `https://en.wikipedia.org/wiki/${encodeURIComponent(title.replaceAll(' ', '_'))}`;
  const ms = value => `${Math.round(value).toLocaleString()} ms`;
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function setStatus(text, isError = false) {
    $('status').textContent = text;
    $('status').classList.toggle('error', isError);
  }

  // The pages so far as chips, ending in the target: dashed until Jev reaches it.
  function showPath(titles, targetTitle, reached) {
    const chips = titles.map(title => el('span', 'chip', title));
    if (reached) chips.at(-1).className = 'chip reached';
    else chips.push(el('span', 'chip target', targetTitle));
    $('path').replaceChildren(...chips.map(chip => {
      const li = el('li');
      li.append(chip);
      return li;
    }));
  }

  function showHop(event) {
    const card = $('hop-template').content.firstElementChild.cloneNode(true);
    card.querySelector('.n').textContent = `${event.n}.`;
    const link = card.querySelector('h2 a');
    link.textContent = event.page;
    link.href = wikiUrl(event.page);
    const meta = card.querySelector('.meta');
    if (event.by === 'jev') {
      meta.textContent = `${event.links.toLocaleString()} links · ${plural(event.calls, 'call')} · ` +
        `Jev ${ms(event.jev_ms)} · Wikipedia ${ms(event.wiki_ms)}`;
      event.top.forEach(([title, p], i) => {
        const row = el('li', i === 0 ? 'option chosen' : 'option');
        const name = el('span', 'name', title);
        name.title = title;
        const track = el('span', 'track');
        const fill = el('span', 'fill');
        fill.style.width = `${(p * 100).toFixed(1)}%`;
        track.append(fill);
        row.append(name, track, el('span', 'pct', `${(p * 100).toFixed(1)}%`));
        card.querySelector('.options').append(row);
      });
      setStatus(`Clicked ${event.pick}. Fetching it…`);
    } else {
      meta.textContent = `Wikipedia ${ms(event.wiki_ms)}`;
      const note = card.querySelector('.note');
      note.hidden = false;
      note.textContent = event.pick
        ? `${event.pick} is linked on this page, so code clicks it. No model call needed.`
        : 'No unvisited links left on this page.';
    }
    $('hops').append(card);
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showDone(event, targetTitle) {
    showPath(event.path, targetTitle, event.won);
    const perDecision = event.decisions ? event.jev_s * 1000 / event.decisions : 0;
    $('summary').replaceChildren(
      el('strong', event.won ? 'won' : 'lost', event.won ? `Jev reached ${targetTitle} in ${plural(event.clicks, 'click')}`
                                                        : `Jev did not reach ${targetTitle} in ${plural(event.clicks, 'click')}`),
      el('p', '', `Total ${event.total_s.toFixed(1)} s · Jev ${event.jev_s.toFixed(2)} s over ${plural(event.decisions, 'decision')} ` +
                  `(${ms(perDecision)} each) · Wikipedia ${event.wiki_s.toFixed(2)} s`),
    );
    $('summary').hidden = false;
    setStatus('');
  }

  $('race-form').addEventListener('submit', e => {
    e.preventDefault();
    const data = new FormData(e.target);
    const pair = { start: data.get('start').trim(), target: data.get('target').trim() };
    source?.close();
    $('path').replaceChildren();
    $('hops').replaceChildren();
    $('summary').hidden = true;
    setStatus('Looking up the target…');

    const stream = source = new EventSource(`/race?${new URLSearchParams(pair)}`);
    const visited = [];
    let targetTitle = pair.target;
    stream.onmessage = ({ data }) => {
      const event = JSON.parse(data);
      if (event.type === 'target') {
        targetTitle = event.title;
        showPath(visited, targetTitle, false);
        setStatus('Reading the starting page…');
      } else if (event.type === 'hop') {
        visited.push(event.page);
        showPath(visited, targetTitle, false);
        showHop(event);
      } else if (event.type === 'done') {
        stream.close();
        showDone(event, targetTitle);
      } else if (event.type === 'error') {
        stream.close();
        setStatus(event.message, true);
      }
    };
    // The server ends the stream after "done" or "error", which the handlers above close first;
    // any other end is a lost connection, and the browser would otherwise reconnect and rerun the race.
    stream.onerror = () => {
      stream.close();
      setStatus('Lost the connection to the server.', true);
    };
  });
</script>
</body>
</html>
